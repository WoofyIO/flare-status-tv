name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and tvOS build
    # GitHub-hosted only. No secrets, no signing.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Unit tests (decoding and model layer)
        working-directory: FlareStatusKit
        run: swift test

      - name: Build the app for the tvOS Simulator
        run: |
          xcodebuild build \
            -project FlareStatus.xcodeproj \
            -scheme FlareStatus \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
